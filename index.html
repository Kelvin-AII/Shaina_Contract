<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>合同生成器</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="main.js" defer></script>
</head>

<body>

<h2>填写合同信息</h2>

<input id="landlord" value="张三" placeholder="甲方"><br>
<input id="tenant" value="李四" placeholder="乙方"><br>
<input id="address" value="东京涩谷区" placeholder="地址"><br>

<select id="usage">
  <option>居住</option>
  <option>办公</option>
</select><br>

<input id="rent" value="80000"><br>
<input id="deposit" value="80000"><br>
<input id="months" value="12"><br>
<input id="start" value="2026-06-01"><br>

<select id="payment">
  <option>银行转账</option>
  <option>现金</option>
</select><br>

<input id="location" value="东京"><br>

<button onclick="generatePDF()">生成 PDF</button>

</body>
</html>
